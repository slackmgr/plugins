name: CI (sqs)

on:
  push:
    branches: [ main ]
    paths:
      - 'sqs/*.go'
      - 'sqs/go.mod'
      - 'sqs/go.sum'
      - 'go.work'
      - '.golangci.yaml'
      - '.github/workflows/ci-sqs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sqs/*.go'
      - 'sqs/go.mod'
      - 'sqs/go.sum'
      - 'go.work'
      - '.golangci.yaml'
      - '.github/workflows/ci-sqs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Read Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' sqs/go.mod)
        if [ -z "$version" ]; then echo "::error::Could not read Go version from sqs/go.mod"; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true
        cache: true
        cache-dependency-path: 'sqs/go.sum'

    - name: Run go fmt
      working-directory: sqs
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not properly formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Run go vet
      working-directory: sqs
      run: go vet ./...

    - name: Run tests
      working-directory: sqs
      run: |
        go test -race -cover ./... 2>&1 | tee /tmp/test-output.txt
        test_exit=${PIPESTATUS[0]}
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        grep "coverage:" /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY || true
        exit $test_exit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Read Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' sqs/go.mod)
        if [ -z "$version" ]; then echo "::error::Could not read Go version from sqs/go.mod"; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true
        cache: true
        cache-dependency-path: 'sqs/go.sum'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: latest
        args: --timeout=5m
        working-directory: sqs

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Read Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' sqs/go.mod)
        if [ -z "$version" ]; then echo "::error::Could not read Go version from sqs/go.mod"; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true
        cache: true
        cache-dependency-path: 'sqs/go.sum'

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      working-directory: sqs
      run: gosec ./...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      working-directory: sqs
      run: govulncheck ./...
